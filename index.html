<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon TCG — La mia collezione</title>
<style>
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#16213e; --border:#2a2a4a;
  --text:#e8e8f0; --text2:#9090b0; --accent:#ffcb05; --accent2:#3b6be0;
  --green:#43a047; --red:#e53935;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-bottom:2px solid var(--accent);padding:14px 16px 10px;}
header h1{font-size:1.3rem;color:var(--accent);font-weight:800;}
header p{color:var(--text2);font-size:0.78rem;margin-top:2px;}
.global-stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.stat-pill{background:rgba(255,203,5,.12);border:1px solid rgba(255,203,5,.3);border-radius:20px;padding:3px 10px;font-size:0.72rem;color:var(--accent);font-weight:600;}
#view-sets,#view-cards{display:none;}
#view-sets.active,#view-cards.active{display:block;}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;}
.controls input,.controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:0.82rem;}
.controls input{flex:1;min-width:130px;}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--accent);}
.count-badge{margin-left:auto;background:var(--accent2);color:#fff;border-radius:20px;padding:3px 10px;font-size:0.72rem;font-weight:600;white-space:nowrap;}
.era-section{margin-bottom:2px;}
.era-header{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;background:var(--surface2);border-left:4px solid var(--accent);user-select:none;}
.era-header:hover{background:#1f2a4a;}
.era-header h2{font-size:0.88rem;font-weight:700;flex:1;}
.era-badge{font-size:0.7rem;color:var(--text2);}
.era-toggle{color:var(--accent);font-size:0.75rem;}
.era-body{display:none;}
.era-body.open{display:block;}
.sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:10px 12px;}
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;overflow:hidden;}
.set-card:hover{transform:translateY(-2px);border-color:var(--accent);}
.set-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.set-name{font-weight:700;font-size:0.88rem;}
.set-meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.set-year{color:var(--accent);font-size:0.72rem;font-weight:600;}
.set-cards-count{font-size:0.72rem;color:var(--text2);}
.set-progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:7px;}
.set-progress-fill{height:100%;border-radius:2px;background:var(--green);transition:width .3s;}
.set-progress-text{font-size:0.68rem;color:var(--text2);margin-top:3px;}
.tag-special{font-size:0.62rem;background:#1a0a2e;color:#ce93d8;border-radius:3px;padding:1px 4px;}
.cards-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.back-btn{background:var(--border);border:none;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;}
.back-btn:hover{background:var(--accent2);}
.cards-header h2{font-size:0.95rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cards-stats{font-size:0.72rem;color:var(--text2);white-space:nowrap;}
.cards-controls{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.cards-controls input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:0.8rem;flex:1;min-width:110px;}
.cards-controls input:focus{outline:none;border-color:var(--accent);}
.cards-controls select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:0.78rem;}
.btn-mark-all{background:var(--green);border:none;color:#fff;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:0.72rem;font-weight:600;}
.btn-unmark-all{background:var(--red);border:none;color:#fff;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:0.72rem;font-weight:600;}
.loading{text-align:center;padding:40px;color:var(--text2);}
.loading-spinner{font-size:2rem;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:#2a1a1a;border:1px solid var(--red);border-radius:8px;padding:14px;margin:12px;color:#ff8a80;font-size:0.85rem;}
/* Cards grid — foto */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px;}
.card-item{background:var(--surface);border:2px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;}
.card-item:hover{transform:translateY(-3px);border-color:var(--accent2);}
.card-item.owned{border-color:var(--green);}
.card-img-wrap{position:relative;aspect-ratio:3/4;background:#111;overflow:hidden;}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s;}
.card-img.loading-img{opacity:0;}
.card-img-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:0.7rem;text-align:center;padding:8px;}
.card-owned-badge{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#fff;opacity:0;transition:opacity .15s;}
.card-item.owned .card-owned-badge{opacity:1;}
.card-info{padding:6px 8px;}
.card-number{font-size:0.6rem;color:var(--text2);}
.card-name{font-size:0.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-rarity{font-size:0.6rem;color:var(--text2);}
.no-results{text-align:center;color:var(--text2);padding:40px;font-size:0.88rem;}
/* Era colors */
.era-WoTC .set-card::before{background:#b71c1c;} .era-WoTC .era-header{border-left-color:#ef5350;}
.era-EX .set-card::before{background:#1565c0;} .era-EX .era-header{border-left-color:#42a5f5;}
.era-DP .set-card::before{background:#4a148c;} .era-DP .era-header{border-left-color:#ab47bc;}
.era-HGSS .set-card::before{background:#e65100;} .era-HGSS .era-header{border-left-color:#ff7043;}
.era-BW .set-card::before{background:#212121;} .era-BW .era-header{border-left-color:#9e9e9e;}
.era-XY .set-card::before{background:#1b5e20;} .era-XY .era-header{border-left-color:#66bb6a;}
.era-SM .set-card::before{background:#f57f17;} .era-SM .era-header{border-left-color:#ffca28;}
.era-SWSH .set-card::before{background:#006064;} .era-SWSH .era-header{border-left-color:#26c6da;}
.era-SV .set-card::before{background:#880e4f;} .era-SV .era-header{border-left-color:#f06292;}
.era-ME .set-card::before{background:#bf360c;} .era-ME .era-header{border-left-color:#ff7043;}
/* API key prompt */
.apikey-banner{background:#1a1a0a;border:1px solid #ffcb0555;border-radius:8px;padding:12px 14px;margin:10px 12px;font-size:0.8rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.apikey-banner input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:6px;font-size:0.8rem;flex:1;min-width:200px;}
.apikey-banner button{background:var(--accent);border:none;color:#000;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:0.8rem;}
</style>
</head>
<body>
<header>
  <h1>⚡ Pokémon TCG — La mia collezione</h1>
  <p>Clicca un set · Spunta le carte che hai · Salvato automaticamente</p>
  <div class="global-stats">
    <span class="stat-pill" id="stat-sets">Set: —</span>
    <span class="stat-pill" id="stat-cards">Carte totali: —</span>
    <span class="stat-pill" id="stat-owned">Possedute: 0</span>
  </div>
</header>

<div id="view-sets" class="active">
  <div class="controls">
    <input type="text" id="search" placeholder="🔍 Cerca set…" oninput="filterSets()">
    <select id="eraFilter" onchange="filterSets()">
      <option value="">Tutte le ere</option>
      <option value="WoTC">Wizards of the Coast</option>
      <option value="EX">EX Series</option>
      <option value="DP">Diamond &amp; Pearl</option>
      <option value="HGSS">HeartGold SoulSilver</option>
      <option value="BW">Black &amp; White</option>
      <option value="XY">XY</option>
      <option value="SM">Sun &amp; Moon</option>
      <option value="SWSH">Sword &amp; Shield</option>
      <option value="SV">Scarlet &amp; Violet</option>
      <option value="ME">Mega Evolution</option>
    </select>
    <div class="count-badge" id="countBadge">…</div>
  </div>
  <div id="sets-app"><div class="loading"><span class="loading-spinner">⚡</span><br><br>Caricamento set…</div></div>
</div>

<div id="view-cards">
  <div class="cards-header">
    <button class="back-btn" onclick="goBack()">← Indietro</button>
    <h2 id="cards-title">—</h2>
    <div class="cards-stats" id="cards-stats">—</div>
  </div>
  <div class="cards-controls">
    <input type="text" id="card-search" placeholder="🔍 Cerca carta…" oninput="renderCards()">
    <select id="filter-owned" onchange="renderCards()">
      <option value="">Tutte</option>
      <option value="owned">✅ Ho</option>
      <option value="missing">❌ Manca</option>
    </select>
    <button class="btn-mark-all" onclick="markAll(true)">✅ Tutte</button>
    <button class="btn-unmark-all" onclick="markAll(false)">❌ Nessuna</button>
  </div>
  <div id="cards-container"><div class="loading"><span class="loading-spinner">⚡</span><br><br>Caricamento carte…</div></div>
</div>

<script>
// ===================== CONFIG =====================
const API_BASE = 'https://api.pokemontcg.io/v2';
// Chiave API opzionale — senza chiave funziona ma con rate limit basso
// Registrati gratis su https://dev.pokemontcg.io per una chiave
let API_KEY = localStorage.getItem('pkm_apikey') || '';

// ===================== ERA MAP =====================
const ERAS = [
  {id:'WoTC',name:'Wizards of the Coast',years:'1999–2003'},
  {id:'EX',name:'EX Series',years:'2003–2007'},
  {id:'DP',name:'Diamond & Pearl / Platinum',years:'2007–2010'},
  {id:'HGSS',name:'HeartGold & SoulSilver',years:'2010–2011'},
  {id:'BW',name:'Black & White',years:'2011–2013'},
  {id:'XY',name:'XY',years:'2014–2016'},
  {id:'SM',name:'Sun & Moon',years:'2017–2019'},
  {id:'SWSH',name:'Sword & Shield',years:'2020–2023'},
  {id:'SV',name:'Scarlet & Violet',years:'2023–2025'},
  {id:'ME',name:'Mega Evolution',years:'2025–'},
];

// set.id → era
const ERA_MAP = {
  base1:'WoTC',jungle:'WoTC',fossil:'WoTC',base2:'WoTC',teamrocket:'WoTC',
  gym1:'WoTC',gym2:'WoTC',neo1:'WoTC',neo2:'WoTC',neo3:'WoTC',neo4:'WoTC',
  si1:'WoTC',lc:'WoTC',ecard1:'WoTC',ecard2:'WoTC',ecard3:'WoTC',
  ex1:'EX',ex2:'EX',ex3:'EX',ex4:'EX',ex5:'EX',ex6:'EX',ex7:'EX',
  ex8:'EX',ex9:'EX',ex10:'EX',ex11:'EX',ex12:'EX',ex13:'EX',ex14:'EX',ex15:'EX',ex16:'EX',
  dp1:'DP',dp2:'DP',dp3:'DP',dp4:'DP',dp5:'DP',dp6:'DP',dp7:'DP',
  pl1:'DP',pl2:'DP',pl3:'DP',pl4:'DP',
  hgss1:'HGSS',hgss2:'HGSS',hgss3:'HGSS',hgss4:'HGSS',col1:'HGSS',
  bw1:'BW',bw2:'BW',bw3:'BW',bw4:'BW',bw5:'BW',bw6:'BW',bw7:'BW',
  bw8:'BW',bw9:'BW',bw10:'BW',bw11:'BW',dv1:'BW',
  xy0:'XY',xy1:'XY',xy2:'XY',xy3:'XY',xy4:'XY',xy5:'XY',xy6:'XY',
  xy7:'XY',xy8:'XY',xy9:'XY',xy10:'XY',xy11:'XY',xy12:'XY',
  dc1:'XY',g1:'XY',
  sm1:'SM',sm2:'SM',sm3:'SM',sm4:'SM',sm5:'SM',sm6:'SM',sm7:'SM',
  sm8:'SM',sm9:'SM',sm10:'SM',sm11:'SM',sm12:'SM',
  sm35:'SM',sm75:'SM',sm115:'SM',det1:'SM',
  swsh1:'SWSH',swsh2:'SWSH',swsh3:'SWSH',swsh4:'SWSH',swsh5:'SWSH',
  swsh6:'SWSH',swsh7:'SWSH',swsh8:'SWSH',swsh9:'SWSH',swsh10:'SWSH',
  swsh11:'SWSH',swsh12:'SWSH',swsh12pt5:'SWSH',
  swsh35:'SWSH',swsh45:'SWSH',cel25:'SWSH',pgo:'SWSH',
  sv1:'SV',sv2:'SV',sv3:'SV',sv4:'SV',sv5:'SV',sv6:'SV',sv7:'SV',
  sv8:'SV',sv9:'SV',sv10:'SV',sv11:'SV',sv11b:'SV',
  sv3pt5:'SV',sv4pt5:'SV',sv6pt5:'SV',sv8pt5:'SV',
};

// set speciali (badge viola)
const SPECIAL_SETS = new Set(['si1','lc','dv1','dc1','g1','sm35','sm75','sm115','det1',
  'swsh35','swsh45','cel25','pgo','swsh12pt5','sv3pt5','sv4pt5','sv6pt5','sv8pt5','xy0']);

// ===================== STATE =====================
let owned = {};
let allSets = [];
let currentSetId = null;
let currentCards = [];

function loadOwned(){
  try{ owned = JSON.parse(localStorage.getItem('pkm3_owned')||'{}'); }catch(e){ owned={}; }
}
function saveOwned(){
  try{ localStorage.setItem('pkm3_owned', JSON.stringify(owned)); }catch(e){}
}

// ===================== API =====================
async function apiFetch(endpoint){
  const headers = {};
  if(API_KEY) headers['X-Api-Key'] = API_KEY;
  const r = await fetch(API_BASE + endpoint, {headers});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function fetchAllSets(){
  // L'API restituisce max 250 per pagina; i set sono ~200 quindi una chiamata basta
  const data = await apiFetch('/sets?orderBy=releaseDate&pageSize=250');
  return data.data;
}

async function fetchCards(setId){
  let page = 1, all = [];
  while(true){
    const data = await apiFetch(`/cards?q=set.id:${setId}&pageSize=250&page=${page}&orderBy=number`);
    all = all.concat(data.data);
    if(all.length >= data.totalCount) break;
    page++;
  }
  return all;
}

// ===================== GLOBAL STATS =====================
function updateGlobalStats(){
  const ownedCount = Object.keys(owned).length;
  document.getElementById('stat-sets').textContent = `Set: ${allSets.length}`;
  const total = allSets.reduce((s,x)=>s+(x.total||0),0);
  document.getElementById('stat-cards').textContent = `Carte totali: ${total.toLocaleString('it')}`;
  document.getElementById('stat-owned').textContent = `Possedute: ${ownedCount}`;
}

function countOwnedInSet(setId){
  return Object.keys(owned).filter(k=>k.startsWith(setId+'_')).length;
}

// ===================== SETS VIEW =====================
function filterSets(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const era = document.getElementById('eraFilter').value;
  const filtered = allSets.filter(s=>{
    if(q && !s.name.toLowerCase().includes(q)) return false;
    const e = ERA_MAP[s.id];
    if(era && e !== era) return false;
    return true;
  });
  document.getElementById('countBadge').textContent = filtered.length+' set';
  renderSets(filtered);
}

function renderSets(filtered){
  const app = document.getElementById('sets-app');
  if(!filtered.length){ app.innerHTML='<div class="no-results">Nessun set trovato.</div>'; return; }
  const byEra = {};
  filtered.forEach(s=>{
    const e = ERA_MAP[s.id]||'SV';
    if(!byEra[e]) byEra[e]=[];
    byEra[e].push(s);
  });
  let html='';
  ERAS.forEach(era=>{
    const sets=byEra[era.id];
    if(!sets||!sets.length) return;
    html+=`<div class="era-section era-${era.id}">
      <div class="era-header" onclick="toggleEra('${era.id}')">
        <h2>${era.name}</h2>
        <span class="era-badge">${era.years} · ${sets.length} set</span>
        <span class="era-toggle" id="toggle-${era.id}">▼</span>
      </div>
      <div class="era-body open" id="body-${era.id}">
        <div class="sets-grid">`;
    sets.forEach(s=>{
      const oc=countOwnedInSet(s.id);
      const total=s.total||0;
      const pct=total?Math.round(oc/total*100):0;
      const special=SPECIAL_SETS.has(s.id);
      html+=`<div class="set-card" onclick="openSet('${s.id}')">
        <div class="set-name">${s.name}${special?' <span class="tag-special">Speciale</span>':''}</div>
        <div class="set-meta">
          <span class="set-year">📅 ${s.releaseDate||''}</span>
          <span class="set-cards-count">🃏 ${total}</span>
        </div>
        <div class="set-progress-bar"><div class="set-progress-fill" style="width:${pct}%"></div></div>
        <div class="set-progress-text">${oc}/${total} · ${pct}%</div>
      </div>`;
    });
    html+=`</div></div></div>`;
  });
  // set senza era mappata
  if(byEra['undefined']||byEra[undefined]){
    // skip silently
  }
  app.innerHTML=html;
}

function toggleEra(id){
  const body=document.getElementById('body-'+id);
  const tog=document.getElementById('toggle-'+id);
  if(body.classList.contains('open')){body.classList.remove('open');tog.textContent='▶';}
  else{body.classList.add('open');tog.textContent='▼';}
}

// ===================== CARDS VIEW =====================
async function openSet(setId){
  currentSetId=setId;
  currentCards=[];
  document.getElementById('view-sets').classList.remove('active');
  document.getElementById('view-cards').classList.add('active');
  const setObj=allSets.find(s=>s.id===setId)||{name:setId};
  document.getElementById('cards-title').textContent=setObj.name;
  document.getElementById('cards-stats').textContent='…';
  document.getElementById('card-search').value='';
  document.getElementById('filter-owned').value='';
  document.getElementById('cards-container').innerHTML='<div class="loading"><span class="loading-spinner">⚡</span><br><br>Caricamento carte…</div>';
  try{
    currentCards = await fetchCards(setId);
    renderCards();
  }catch(e){
    document.getElementById('cards-container').innerHTML=`<div class="error-box">❌ Errore caricamento: ${e.message}<br><br>Controlla la connessione o aggiungi una API key.</div>`;
  }
}

function goBack(){
  document.getElementById('view-cards').classList.remove('active');
  document.getElementById('view-sets').classList.add('active');
  currentSetId=null; currentCards=[];
  filterSets();
  updateGlobalStats();
}

function renderCards(){
  if(!currentSetId) return;
  const q=document.getElementById('card-search').value.toLowerCase().trim();
  const filter=document.getElementById('filter-owned').value;
  const visible=currentCards.filter(c=>{
    if(q && !c.name.toLowerCase().includes(q) && !c.number.includes(q)) return false;
    const isOwned=!!owned[currentSetId+'_'+c.id];
    if(filter==='owned' && !isOwned) return false;
    if(filter==='missing' && isOwned) return false;
    return true;
  });
  const oc=currentCards.filter(c=>owned[currentSetId+'_'+c.id]).length;
  const pct=currentCards.length?Math.round(oc/currentCards.length*100):0;
  document.getElementById('cards-stats').textContent=`${oc}/${currentCards.length} · ${pct}%`;
  const html=`<div class="cards-grid">${visible.map(c=>{
    const key=currentSetId+'_'+c.id;
    const isOwned=!!owned[key];
    const img=c.images&&c.images.small?c.images.small:'';
    return `<div class="card-item${isOwned?' owned':''}" onclick="toggleCard('${key}')" data-key="${key}">
      <div class="card-img-wrap">
        ${img?`<img class="card-img loading-img" src="${img}" alt="${c.name}" onload="this.classList.remove('loading-img')" onerror="this.style.display='none'">
        <div class="card-img-placeholder">🃏 ${c.name}</div>`
        :`<div class="card-img-placeholder">🃏 ${c.name}</div>`}
        <div class="card-owned-badge">✓</div>
      </div>
      <div class="card-info">
        <div class="card-number">#${c.number}</div>
        <div class="card-name">${c.name}</div>
        <div class="card-rarity">${c.rarity||''}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
  document.getElementById('cards-container').innerHTML=html;
}

function toggleCard(key){
  owned[key]=!owned[key];
  if(!owned[key]) delete owned[key];
  saveOwned();
  const el=document.querySelector(`[data-key="${key}"]`);
  if(el) el.classList.toggle('owned',!!owned[key]);
  // aggiorna stats
  const oc=currentCards.filter(c=>owned[currentSetId+'_'+c.id]).length;
  const pct=currentCards.length?Math.round(oc/currentCards.length*100):0;
  document.getElementById('cards-stats').textContent=`${oc}/${currentCards.length} · ${pct}%`;
}

function markAll(val){
  const q=document.getElementById('card-search').value.toLowerCase().trim();
  const filter=document.getElementById('filter-owned').value;
  currentCards.forEach(c=>{
    if(q && !c.name.toLowerCase().includes(q) && !c.number.includes(q)) return;
    const isOwned=!!owned[currentSetId+'_'+c.id];
    if(filter==='owned' && !isOwned) return;
    if(filter==='missing' && isOwned) return;
    const key=currentSetId+'_'+c.id;
    if(val) owned[key]=true;
    else delete owned[key];
  });
  saveOwned();
  renderCards();
}

// ===================== INIT =====================
loadOwned();

(async()=>{
  try{
    const sets = await fetchAllSets();
    // Aggiungi .total da printedTotal o cardCount
    allSets = sets.map(s=>({
      ...s,
      total: s.printedTotal || s.total || 0,
    }));
    updateGlobalStats();
    filterSets();
  }catch(e){
    document.getElementById('sets-app').innerHTML=`
      <div class="error-box">
        ❌ Impossibile caricare i set: ${e.message}<br><br>
        Se vedi questo errore spesso, registrati gratis su
        <a href="https://dev.pokemontcg.io" target="_blank" style="color:#ffcb05">dev.pokemontcg.io</a>
        per ottenere una API key gratuita e inseriscila qui sotto:
      </div>
      <div class="apikey-banner">
        🔑 API Key pokemontcg.io (opzionale):
        <input type="text" id="apikeyinput" placeholder="incolla qui la tua chiave…" value="${API_KEY}">
        <button onclick="saveKey()">Salva e riprova</button>
      </div>`;
  }
})();

function saveKey(){
  API_KEY=document.getElementById('apikeyinput').value.trim();
  localStorage.setItem('pkm_apikey',API_KEY);
  location.reload();
}
</script>
</body>
</html>
